<title>Zando — Gestion des commandes</title>

<script

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family:
            Inter,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        background: #f5f7fb;
        color: #172033;
    }

    .container {
        width: 100%;
        max-width: 1200px;
        margin: auto;
        padding: 20px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        background: #111827;
        color: white;
    }

    .header-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
    }

    .brand {
        font-size: 25px;
        font-weight: 900;
    }

    .subtitle {
        color: #cbd5e1;
        margin-top: 3px;
        font-size: 14px;
    }

    .badge {
        background: #374151;
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
    }

    /* =========================
       ERROR
    ========================= */

    .error {
        display: none;
        background: #fef2f2;
        color: #991b1b;
        padding: 14px;
        border-radius: 10px;
        margin-bottom: 18px;
        border: 1px solid #fecaca;

    /* =========================
       STATS
    ========================= */

    .stats {
        display: grid;
        grid-template-columns:

        gap: 14px;

    .stat {

        padding: 18px;

    }

    .stat-label {

        font-size: 14px;
    }

    .stat strong {
        display: block;
        margin-top: 6px;
        font-size: 25px;
    }

    /* =========================
       TOOLBAR
    ========================= */

    .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
    }

    input,
    select {
        padding: 12px;
        border: 1px solid #d8dee9;
        border-radius: 10px;
        background: white;
        font: inherit;
    }

    input {
        flex: 1;
        min-width: 240px;
    }

    button {
        border: 0;
        border-radius: 9px;
        padding: 10px 14px;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
    }

    button:hover {
        opacity: 0.9;
    }

    .primary {
        background: #111827;
        color: white;
    }

    .secondary {
        background: #e5e7eb;
        color: #111827;
    }

    /* =========================
       TABLE
    ========================= */

    .card {
        background: white;
        border: 1px solid #e5e9f0;
        border-radius: 16px;
        overflow: hidden;
        box-shadow:
            0 4px 18px rgba(17, 24, 39, 0.05);
    }

    .table-wrap {
        overflow-x: auto;
    }

    table {
        width: 100%;
        min-width: 900px;
        border-collapse: collapse;
    }

    th,
    td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid #edf0f4;
        font-size: 14px;
    }

    th {
        background: #f8fafc;
        color: #667085;
        font-size: 12px;
        text-transform: uppercase;
    }

    .muted {
        color: #667085;
    }

    .empty {
        text-align: center;
        padding: 45px;
        color: #667085;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
        display: inline-block;
        padding: 6px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
    }

    .pending {
        background: #fff7ed;
        color: #c2410c;
    }

    .confirmed {
        background: #eff6ff;
        color: #1d4ed8;
    }

    .shipped {
        background: #f5f3ff;
        color: #6d28d9;
    }

    .delivered {
        background: #ecfdf5;
        color: #047857;
    }

    .cancelled {
        background: #fef2f2;
        color: #b91c1c;
    }

    .paid {
        background: #ecfdf5;
        color: #047857;
    }

    .unpaid {
        background: #fff7ed;
        color: #c2410c;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);

        display: none;

        align-items: center;
        justify-content: center;

        padding: 18px;

        z-index: 1000;
    }

    .modal.active {
        display: flex;
    }

    .modal-box {
        background: white;
        width: min(700px, 100%);
        max-height: 90vh;
        overflow-y: auto;

        border-radius: 18px;
        padding: 22px;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;

        margin-bottom: 15px;
    }

    .modal-header h2 {
        margin: 0;
    }

    .close-button {
        background: #f1f5f9;
        color: #111827;
    }

    .order-item {
        display: flex;
        justify-content: space-between;
        gap: 15px;

        padding: 13px 0;

        border-bottom: 1px solid #e5e7eb;
    }

    .order-total {
        display: flex;
        justify-content: space-between;

        margin-top: 18px;

        font-size: 20px;
        font-weight: 900;
    }

    .management {
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;
    }

    .management h3 {
        margin-top: 0;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

        .container {
            padding: 14px;
        }

        .stats {
            grid-template-columns: 1fr;
        }

        .header-inner {
            align-items: flex-start;
            flex-direction: column;
        }

        .toolbar {
            flex-direction: column;
        }

        input,
        select,
        .toolbar button {
            width: 100%;
        }

    }

</style>

</head><body><header class="header"><div class="container header-inner">

<div class="toolbar">

</div><script>

/* =====================================================
   CONFIGURATION SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://kcrliiinrjlrcspnaeac.supabase.co";

/*
 * IMPORTANT :
 * Utilise ici uniquement ta clé publishable / anon.
 * Ne mets JAMAIS la service_role_key dans ce fichier.
 */

const SUPABASE_KEY =
    "sb_publishable_iv3rzG16WGv7e7DObdzCNw_dDs4VDM3";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   STATE
===================================================== */

let orders = [];


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function formatMoney(
    amount,
    currency
) {

    return (
        Number(amount || 0).toFixed(2)
        + " "
        + escapeHTML(currency || "USD")
    );

}


function formatDate(value) {

    if (!value) {
        return "—";
    }

    return new Date(value)
        .toLocaleString("fr-FR");

}


function showError(message) {

    const errorBox =
        document.getElementById("error");

    if (!errorBox) {
        console.error(
            "❌ Élément #error introuvable :",
            message
        );
        return;
    }

    errorBox.textContent =
        message || "Une erreur est survenue.";

    errorBox.style.display = "block";

}


function hideError() {

    const errorBox =
        document.getElementById("error");

    if (!errorBox) {
        return;
    }

    errorBox.style.display = "none";

}


function statusLabel(status) {

    const labels = {

        pending: "En attente",

        confirmed: "Confirmée",

        shipped: "Expédiée",

        delivered: "Livrée",

        cancelled: "Annulée"

    };

    return labels[status] || status || "—";

}


/* =====================================================
   VERIFICATION ADMIN
===================================================== */

async function requireAdmin() {

    const {
        data: {
            user
        },
        error
    } = await supabaseClient.auth.getUser();

    if (error) {
        throw error;
    }

    if (!user) {

        throw new Error(
            "AUTH_REQUIRED"
        );

    }

    const {
        data: profile,
        error: profileError
    } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

    if (profileError) {
        throw profileError;
    }

    if (!profile || profile.role !== "admin") {

        throw new Error(
            "ADMIN_REQUIRED"
        );

    }

    return user;
}
       
        


/* =====================================================
   STATISTIQUES GLOBALES
===================================================== */

async function loadDashboardStats() {

    try {

        await requireAdmin();

        const [
            clientsResult,
            storesResult,
            productsResult
        ] = await Promise.all([

            supabaseClient
                .from("profiles")
                .select("id", {
                    count: "exact",
                    head: true
                })
                .eq("role", "customer"),

            supabaseClient
                .from("stores")
                .select("id", {
                    count: "exact",
                    head: true
                }),

            supabaseClient
                .from("products")
                .select("id", {
                    count: "exact",
                    head: true
                })

        ]);

        if (clientsResult.error) {
            throw clientsResult.error;
        }

        if (storesResult.error) {
            throw storesResult.error;
        }

        if (productsResult.error) {
            throw productsResult.error;
        }

        const clients =
            clientsResult.count ?? 0;

        const stores =
            storesResult.count ?? 0;

        const products =
            productsResult.count ?? 0;

        const clientsElement =
            document.getElementById("statClients");

        const storesElement =
            document.getElementById("statStores");

        const productsElement =
            document.getElementById("statProducts");

        if (clientsElement) {
            clientsElement.textContent = clients;
        }

        if (storesElement) {
            storesElement.textContent = stores;
        }

        if (productsElement) {
            productsElement.textContent = products;
        }

    } catch (error) {

        console.error(
            "❌ Erreur statistiques dashboard :",
            error
        );

    }

}


/* =====================================================
   CHARGEMENT DES COMMANDES
===================================================== */

async function loadOrders() {

    hideError();


    document
        .getElementById("ordersBody")
        .innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="empty"
                >
                    Chargement...
                </td>
            </tr>
        `;


    try {

        await requireAdmin();


        const {
            data,
            error
        } =
            await supabaseClient
                .from("orders")
                .select(`
                    id,
                    user_id,
                    status,
                    payment_status,
                    currency,
                    subtotal,
                    shipping_fee,
                    total,
                    created_at,
                    updated_at
                `)
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {
            throw error;
        }


        orders = data || [];


        /*
         * Récupérer les profils
         * correspondant aux commandes.
         */

        const userIds =
            [
                ...new Set(
                    orders
                        .map(
                            order =>
                                order.user_id
                        )
                        .filter(Boolean)
                )
            ];


        if (userIds.length > 0) {

            const {
                data: profiles,
                error: profilesError
            } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "id, full_name, phone"
                    )
                    .in(
                        "id",
                        userIds
                    );


            if (
                profilesError &&
                profilesError.code !== "PGRST116"
            ) {
                throw profilesError;
            }


            const profileMap =
                new Map(
                    (profiles || [])
                        .map(
                            profile => [
                                profile.id,
                                profile
                            ]
                        )
                );


            orders =
                orders.map(
                    order => ({

                        ...order,

                        profile:
                            profileMap.get(
                                order.user_id
                            )

                    })
                );

        }


        renderOrders();

        await loadDashboardStats();


    } catch (error) {

        console.error(
            "❌ Erreur chargement commandes :",
            error
        );


        showError(
            error.message ||
            "Impossible de charger les commandes."
        );


        document
            .getElementById("ordersBody")
            .innerHTML = `
                <tr>
                    <td
                        colspan="7"
                        class="empty"
                    >
                        Accès impossible.
                    </td>
                </tr>
            `;

    }

}


/* =====================================================
   AFFICHAGE
===================================================== */

function renderOrders() {

    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();


    const statusFilter =
        document
            .getElementById("statusFilter")
            .value;


    const filteredOrders =
        orders.filter(order => {

            const clientName =
                (
                    order.profile?.full_name ||
                    ""
                ).toLowerCase();


            const phone =
                (
                    order.profile?.phone ||
                    ""
                ).toLowerCase();


            const id =
                String(
                    order.id || ""
                ).toLowerCase();


            const matchesSearch =
                !search ||
                id.includes(search) ||
                clientName.includes(search) ||
                phone.includes(search);


            const matchesStatus =
                !statusFilter ||
                order.status === statusFilter;


            return (
                matchesSearch &&
                matchesStatus
            );

        });


    /*
     * Statistiques.
     */

    document
        .getElementById("statOrders")
        .textContent =
            orders.length;


    document
        .getElementById("statPending")
        .textContent =
            orders.filter(
                order =>
                    order.status === "pending"
            ).length;


    const revenue =
        orders
            .filter(
                order =>
                    order.status !== "cancelled"
            )
            .reduce(
                (
                    total,
                    order
                ) =>
                    total +
                    Number(
                        order.total || 0
                    ),
                0
            );


    document
        .getElementById("statRevenue")
        .textContent =
            formatMoney(
                revenue,
                orders[0]?.currency ||
                "USD"
            );


    /*
     * Tableau.
     */

    const tbody =
        document.getElementById(
            "ordersBody"
        );


    if (!filteredOrders.length) {

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="empty"
                >
                    Aucune commande trouvée.
                </td>
            </tr>
        `;

        return;

    }


    tbody.innerHTML =
        filteredOrders
            .map(order => {

                const shortId =
                    String(order.id)
                        .slice(0, 8)
                        .toUpperCase();


                const client =
                    order.profile?.full_name ||
                    "Client";


                const phone =
                    order.profile?.phone ||
                    "";


                const paymentClass =
                    order.payment_status === "paid"
                        ? "paid"
                        : "unpaid";


                return `

                    <tr>

                        <td>

                            <strong>
                                #${escapeHTML(shortId)}
                            </strong>

                            <br>

                            <small class="muted">
                                ${escapeHTML(order.id)}
                            </small>

                        </td>


                        <td>

                            ${escapeHTML(client)}

                            ${
                                phone
                                    ? `
                                        <br>
                                        <small class="muted">
                                            ${escapeHTML(phone)}
                                        </small>
                                    `
                                    : ""
                            }

                        </td>


                        <td>
                            ${escapeHTML(
                                formatDate(
                                    order.created_at
                                )
                            )}
                        </td>


                        <td>

                            <strong>
                                ${formatMoney(
                                    order.total,
                                    order.currency
                                )}
                            </strong>

                        </td>


                        <td>

                            <span
                                class="
                                    status
                                    ${paymentClass}
                                "
                            >
                                ${escapeHTML(
                                    order.payment_status ||
                                    "pending"
                                )}
                            </span>

                        </td>


                        <td>

                            <span
                                class="
                                    status
                                    ${escapeHTML(
                                        order.status
                                    )}
                                "
                            >
                                ${escapeHTML(
                                    statusLabel(
                                        order.status
                                    )
                                )}
                            </span>

                        </td>


                        <td>

                            <button
                                class="primary"
                                onclick="openOrder('${escapeHTML(order.id)}')"
                            >
                                Voir
                            </button>

                        </td>

                    </tr>

                `;

            })
            .join("");

}


/* =====================================================
   DETAIL COMMANDE
===================================================== */

async function openOrder(orderId) {

    hideError();


    const order =
        orders.find(
            item =>
                item.id === orderId
        );


    if (!order) {
        return;
    }


    try {

        const {
            data: items,
            error
        } =
            await supabaseClient
                .from("order_items")
                .select(`
                    product_name,
                    unit_price,
                    quantity,
                    line_total,
                    created_at
                `)
                .eq(
                    "order_id",
                    orderId
                )
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                );


        if (error) {
            throw error;
        }


        document
            .getElementById("modalTitle")
            .textContent =
                "Commande #" +
                String(orderId)
                    .slice(0, 8)
                    .toUpperCase();


        const itemsHTML =
            (items || [])
                .map(item => `

                    <div class="order-item">

                        <span>

                            <strong>
                                ${escapeHTML(
                                    item.product_name
                                )}
                            </strong>

                            <br>

                            <small class="muted">

                                ${Number(
                                    item.quantity || 0
                                )}
                                ×
                                ${formatMoney(
                                    item.unit_price,
                                    order.currency
                                )}

                            </small>

                        </span>


                        <strong>

                            ${formatMoney(
                                item.line_total,
                                order.currency
                            )}

                        </strong>

                    </div>

                `)
                .join("");


        document
            .getElementById("modalContent")
            .innerHTML = `

                <p>

                    <strong>
                        Client :
                    </strong>

                    ${escapeHTML(
                        order.profile?.full_name ||
                        "Client"
                    )}

                </p>


                <p>

                    <strong>
                        Téléphone :
                    </strong>

                    ${escapeHTML(
                        order.profile?.phone ||
                        "—"
                    )}

                </p>


                <p>

                    <strong>
                        Date :
                    </strong>

                    ${escapeHTML(
                        formatDate(
                            order.created_at
                        )
                    )}

                </p>


                <hr>


                ${
                    itemsHTML ||
                    `
                        <p class="muted">
                            Aucun article trouvé.
                        </p>
                    `
                }


                <div class="order-total">

                    <span>
                        Total
                    </span>

                    <span>
                        ${formatMoney(
                            order.total,
                            order.currency
                        )}
                    </span>

                </div>


                <div class="management">

                    <h3>
                        Gestion de la commande
                    </h3>


                    <div class="toolbar">

                        <select id="newStatus">

                            <option value="pending">
                                En attente
                            </option>

                            <option value="confirmed">
                                Confirmée
                            </option>

                            <option value="shipped">
                                Expédiée
                            </option>

                            <option value="delivered">
                                Livrée
                            </option>

                            <option value="cancelled">
                                Annulée
                            </option>

                        </select>


                        <select id="newPayment">

                            <option value="pending">
                                Paiement en attente
                            </option>

                            <option value="paid">
                                Payé
                            </option>

                            <option value="failed">
                                Échec
                            </option>

                            <option value="refunded">
                                Remboursé
                            </option>

                        </select>


                        <button
                            class="primary"
                            onclick="saveOrder('${escapeHTML(orderId)}')"
                        >
                            Enregistrer
                        </button>

                    </div>

                </div>

            `;


        document
            .getElementById("newStatus")
            .value =
                order.status || "pending";


        document
            .getElementById("newPayment")
            .value =
                order.payment_status ||
                "pending";


        document
            .getElementById("modal")
            .classList
            .add("active");


    } catch (error) {

        console.error(
            "❌ Erreur détail commande :",
            error
        );


        showError(
            error.message ||
            "Impossible de charger la commande."
        );

    }

}


/* =====================================================
   MODIFICATION COMMANDE
===================================================== */

async function saveOrder(orderId) {

    try {

        const newStatus =
            document
                .getElementById("newStatus")
                .value;


        const newPayment =
            document
                .getElementById("newPayment")
                .value;


        const {
            error
        } =
            await supabaseClient
                .from("orders")
                .update({

                    status:
                        newStatus,

                    payment_status:
                        newPayment,

                    updated_at:
                        new Date()
                            .toISOString()

                })
                .eq(
                    "id",
                    orderId
                );


        if (error) {
            throw error;
        }


        console.log(
            "✅ Commande mise à jour :",
            orderId
        );


        closeModal();

        await loadOrders();


    } catch (error) {

        console.error(
            "❌ Erreur mise à jour commande :",
            error
        );


        showError(
            error.message ||
            "Impossible de modifier la commande."
        );

    }

}


/* =====================================================
   MODAL
===================================================== */

function closeModal() {

    document
        .getElementById("modal")
        .classList
        .remove("active");

}


document
    .getElementById("close")
    .addEventListener(
        "click",
        closeModal
    );


document
    .getElementById("modal")
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "modal"
            ) {

                closeModal();

            }

        }
    );


document
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape"
            ) {

                closeModal();

            }

        }
    );


/* =====================================================
   FILTRES
===================================================== */

document
    .getElementById("search")
    ?.addEventListener(
        "input",
        renderOrders
    );

document
    .getElementById("statusFilter")
    ?.addEventListener(

        renderOrders
    );

document
    .getElementById("refresh")

    );


/* =====================================================
   AUTHENTIFICATION ADMIN
===================================================== */

const adminLogin =
    document.getElementById("adminLogin");

const adminContent =
    document.getElementById("adminContent");

const adminLoginForm =
    document.getElementById("adminLoginForm");

const adminLoginMessage =
    document.getElementById("adminLoginMessage");


function showAdminLogin(message = "") {

    if (adminLogin) {
        adminLogin.style.display = "block";
    }

    if (adminContent) {
        adminContent.style.display = "none";
    }

    if (adminLoginMessage) {
        adminLoginMessage.textContent = message;

        adminLoginMessage.style.color =
            "#dc2626";
    }

}


function showAdminContent() {

    if (adminLogin) {
        adminLogin.style.display = "none";
    }

    if (adminContent) {
        adminContent.style.display = "block";
    }

}


if (adminLoginForm) {

    adminLoginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const email =
                document
                    .getElementById("adminEmail")
                    ?.value
                    .trim();

            const password =
                document
                    .getElementById("adminPassword")
                    ?.value;

            if (!email || !password) {

                if (adminLoginMessage) {

                    adminLoginMessage.textContent =
                        "Veuillez remplir tous les champs.";

                    adminLoginMessage.style.color =
                        "#dc2626";

                }

                return;
            }


            if (adminLoginMessage) {

                adminLoginMessage.textContent =
                    "Connexion en cours...";

                adminLoginMessage.style.color =
                    "#475569";

            }


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .signInWithPassword({
                            email: email,
                            password: password
                        });


                if (error) {
                    throw error;
                }


                if (!data?.user) {

                    throw new Error(
                        "Connexion impossible."
                    );

                }


                /*
                 * Vérification du rôle ADMIN
                 */

                await requireAdmin();


                showAdminContent();


                if (adminLoginMessage) {

                    adminLoginMessage.textContent = "";

                }


                adminLoginForm.reset();


                await loadOrders();


            } catch (error) {

                console.error(
                    "❌ Connexion admin :",
                    error
                );


                /*
                 * Si le compte n'est pas admin,
                 * on déconnecte immédiatement.
                 */

                if (
                    error.message ===
                    "ADMIN_REQUIRED"
                ) {

                    await supabaseClient
                        .auth
                        .signOut();


                    showAdminLogin(
                        "Accès refusé : ce compte n'est pas administrateur."
                    );

                    return;

                }


                showAdminLogin(
                    error.message ||
                    "Impossible de se connecter."
                );

            }

        }
    );

}


/* =====================================================
   INITIALISATION DU BACK-OFFICE
===================================================== */

async function initAdminPage() {

    /*
     * Toujours commencer par cacher
     * le contenu administrateur.
     */

    if (adminContent) {
        adminContent.style.display = "none";
    }


    try {

        const {
            data: {
                user
            },
            error
        } =
            await supabaseClient.auth.getUser();


        if (error) {
            throw error;
        }


        /*
         * Aucun utilisateur connecté
         */

        if (!user) {

            showAdminLogin();

            return;

        }


        /*
         * Utilisateur connecté :
         * vérifier son rôle.
         */

        try {

            await requireAdmin();

        } catch (error) {

            if (
                error.message ===
                "ADMIN_REQUIRED"
            ) {

                await supabaseClient
                    .auth
                    .signOut();


                showAdminLogin(
                    "Accès refusé : ce compte n'est pas administrateur."
                );

                return;

            }

            throw error;

        }


        /*
         * ADMIN confirmé
         */

        showAdminContent();

        await loadOrders();


    } catch (error) {

        console.error(
            "❌ Initialisation admin :",
            error
        );


        showAdminLogin(
            error.message ||
            "Impossible d'initialiser le back-office."
        );

    }

}


/* =====================================================
   START
===================================================== */

window.saveOrder = saveOrder;

initAdminPage();

</script>
