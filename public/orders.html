<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Mes commandes — Zando Panafricain">

    <title>Mes commandes — Zando</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">

    <div class="topbar">
        <div class="container topbar-content">
            <p>🌍 La marketplace pensée pour l'Afrique</p>

            <div class="top-links">
                <a href="index.html">Accueil</a>
                <a href="index.html#produits">Produits</a>
            </div>
        </div>
    </div>

    <div class="main-header">
        <div class="container header-content">

            <a href="index.html" class="logo">
                <span class="logo-icon">Z</span>
                <span class="logo-text">Zando</span>
            </a>

            <div class="header-actions">
                <a href="index.html" class="icon-action" style="text-decoration:none;">
                    <span>🏠</span>
                    <small>Accueil</small>
                </a>
            </div>

        </div>
    </div>

</header>


<main>
    <section style="padding:40px 0 70px;">

        <div class="container">

            <div style="margin-bottom:28px;">
                <h1 style="margin:0;color:#0f172a;">
                    📦 Mes commandes
                </h1>

                <p style="margin:8px 0 0;color:#64748b;">
                    Suivez vos commandes et consultez leur historique.
                </p>
            </div>

            <div id="ordersMessage"
                style="margin-bottom:20px;">
            </div>

            <div id="ordersList"></div>

        </div>

    </section>
</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

const SUPABASE_URL = "https://kcrliiinrjlrcspnaeac.supabase.co";
const SUPABASE_KEY = "sb_publishable_iv3rzG16WGv7e7DObdzCNw_dDs4VDM3";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const statusLabels = {
    pending: "En attente",
    confirmed: "Confirmée",
    preparing: "En préparation",
    shipped: "Expédiée",
    delivered: "Livrée",
    cancelled: "Annulée"
};


function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function statusLabel(status) {
    return statusLabels[status] || status || "Inconnu";
}


function formatMoney(value, currency) {
    return `${Number(value || 0).toLocaleString("fr-FR")} ${escapeHTML(currency || "USD")}`;
}


function formatDate(value) {
    if (!value) return "Date inconnue";

    return new Date(value).toLocaleString("fr-FR", {
        dateStyle: "medium",
        timeStyle: "short"
    });
}


function showMessage(message, type = "info") {

    const box = document.getElementById("ordersMessage");

    const colors = {
        info: ["#eff6ff", "#1d4ed8"],
        success: ["#f0fdf4", "#15803d"],
        error: ["#fef2f2", "#dc2626"]
    };

    const [background, color] = colors[type] || colors.info;

    box.innerHTML = `
        <div style="
            padding:14px 16px;
            border-radius:12px;
            background:${background};
            color:${color};
        ">
            ${escapeHTML(message)}
        </div>
    `;
}


async function loadOrders() {

    const ordersList = document.getElementById("ordersList");

    ordersList.innerHTML = `
        <div style="
            padding:30px;
            text-align:center;
            color:#64748b;
        ">
            Chargement de vos commandes...
        </div>
    `;

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {

        showMessage(
            "Vous devez être connecté pour consulter vos commandes.",
            "error"
        );

        ordersList.innerHTML = `
            <div style="
                padding:30px;
                background:#fff;
                border-radius:16px;
                text-align:center;
                box-shadow:0 8px 30px rgba(15,23,42,.08);
            ">
                <h3 style="margin:0 0 10px;">
                    Connexion requise
                </h3>

                <p style="color:#64748b;margin:0 0 20px;">
                    Connectez-vous à votre compte Zando pour voir vos commandes.
                </p>

                <a href="index.html"
                    class="btn btn-primary"
                    style="display:inline-block;text-decoration:none;">
                    Retour à Zando
                </a>
            </div>
        `;

        return;
    }

    showMessage(`Connecté en tant que ${user.email}`, "info");

    const { data: orders, error } = await supabaseClient
        .from("orders")
        .select(`
            id,
            status,
            payment_status,
            currency,
            subtotal,
            shipping_fee,
            total,
            notes,
            created_at,
            updated_at,
            order_items(
                id,
                product_id,
                store_id,
                product_name,
                unit_price,
                quantity,
                line_total
            )
        `)
        .eq("user_id", user.id)
        .order("created_at", { ascending: false });

    if (error) {

        console.error("Erreur chargement commandes :", error);

        showMessage(
            "Impossible de charger vos commandes.",
            "error"
        );

        ordersList.innerHTML = "";
        return;
    }

    if (!orders || orders.length === 0) {

        showMessage(
            "Vous n'avez encore aucune commande.",
            "info"
        );

        ordersList.innerHTML = `
            <div style="
                padding:40px 25px;
                background:#fff;
                border-radius:16px;
                text-align:center;
                box-shadow:0 8px 30px rgba(15,23,42,.08);
            ">
                <div style="font-size:42px;margin-bottom:12px;">
                    🛍️
                </div>

                <h3 style="margin:0 0 10px;">
                    Aucune commande
                </h3>

                <p style="color:#64748b;margin:0 0 20px;">
                    Découvrez les produits disponibles sur Zando.
                </p>

                <a href="index.html#produits"
                    class="btn btn-primary"
                    style="display:inline-block;text-decoration:none;">
                    Découvrir les produits
                </a>
            </div>
        `;

        return;
    }

    showMessage(
        `${orders.length} commande${orders.length > 1 ? "s" : ""} trouvée${orders.length > 1 ? "s" : ""}.`,
        "success"
    );

    ordersList.innerHTML = orders.map(order => {

        const items = order.order_items || [];

        const itemCount = items.reduce(
            (sum, item) => sum + Number(item.quantity || 0),
            0
        );

        return `
            <article
                data-order-id="${escapeHTML(order.id)}"
                style="
                    background:#fff;
                    border-radius:16px;
                    padding:20px;
                    margin-bottom:16px;
                    box-shadow:0 8px 30px rgba(15,23,42,.08);
                    border:1px solid #e2e8f0;
                "
            >

                <div style="
                    display:flex;
                    justify-content:space-between;
                    gap:15px;
                    flex-wrap:wrap;
                    align-items:flex-start;
                ">

                    <div>
                        <div style="
                            font-size:13px;
                            color:#64748b;
                            margin-bottom:5px;
                        ">
                            Commande
                        </div>

                        <strong style="
                            color:#0f172a;
                            word-break:break-all;
                        ">
                            #${escapeHTML(order.id)}
                        </strong>

                        <div style="
                            margin-top:7px;
                            color:#64748b;
                            font-size:14px;
                        ">
                            ${escapeHTML(formatDate(order.created_at))}
                        </div>
                    </div>

                    <div style="
                        padding:8px 12px;
                        border-radius:999px;
                        background:#eff6ff;
                        color:#1d4ed8;
                        font-size:14px;
                        font-weight:700;
                    ">
                        ${escapeHTML(statusLabel(order.status))}
                    </div>

                </div>

                <div style="
                    display:grid;
                    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
                    gap:12px;
                    margin-top:20px;
                ">

                    <div style="
                        padding:12px;
                        background:#f8fafc;
                        border-radius:10px;
                    ">
                        <div style="font-size:12px;color:#64748b;">
                            Articles
                        </div>

                        <strong>
                            ${itemCount}
                        </strong>
                    </div>

                    <div style="
                        padding:12px;
                        background:#f8fafc;
                        border-radius:10px;
                    ">
                        <div style="font-size:12px;color:#64748b;">
                            Total
                        </div>

                        <strong>
                            ${formatMoney(order.total, order.currency)}
                        </strong>
                    </div>

                    <div style="
                        padding:12px;
                        background:#f8fafc;
                        border-radius:10px;
                    ">
                        <div style="font-size:12px;color:#64748b;">
                            Paiement
                        </div>

                        <strong>
                            ${escapeHTML(statusLabel(order.payment_status))}
                        </strong>
                    </div>

                </div>

                <button
                    type="button"
                    class="btn btn-primary"
                    data-view-order="${escapeHTML(order.id)}"
                    style="margin-top:18px;width:100%;"
                >
                    Voir les détails
                </button>

            </article>
        `;
    }).join("");

    ordersList.querySelectorAll("[data-view-order]").forEach(button => {

        button.addEventListener("click", () => {

            const order = orders.find(
                item => item.id === button.dataset.viewOrder
            );

            if (order) {
                showOrderDetails(order);
            }
        });

    });
}


async function showOrderDetails(order) {

    const existing = document.getElementById("orderDetailsOverlay");

    if (existing) {
        existing.remove();
    }

    const items = order.order_items || [];

    const overlay = document.createElement("div");

    overlay.id = "orderDetailsOverlay";

    overlay.style.cssText = `
        position:fixed;
        inset:0;
        background:rgba(15,23,42,.55);
        display:flex;
        align-items:center;
        justify-content:center;
        padding:20px;
        z-index:10000;
        overflow:auto;
    `;

    const box = document.createElement("div");

    box.style.cssText = `
        width:100%;
        max-width:650px;
        background:#fff;
        border-radius:16px;
        padding:24px;
        box-shadow:0 20px 50px rgba(0,0,0,.25);
        max-height:90vh;
        overflow:auto;
    `;

    const itemRows = items.map(item => `
        <div style="
            padding:12px 0;
            border-bottom:1px solid #e2e8f0;
        ">

            <div style="
                font-weight:700;
                color:#0f172a;
            ">
                ${escapeHTML(item.product_name)}
            </div>

            <div style="
                margin-top:5px;
                color:#64748b;
                font-size:14px;
            ">
                ${Number(item.quantity || 0)}
                ×
                ${formatMoney(item.unit_price, order.currency)}
            </div>

            <div style="
                margin-top:4px;
                font-weight:600;
            ">
                ${formatMoney(item.line_total, order.currency)}
            </div>

        </div>
    `).join("");

    box.innerHTML = `
        <h2 style="
            margin:0 0 7px;
            color:#0f172a;
        ">
            📦 Détails de la commande
        </h2>

        <p style="
            margin:0 0 20px;
            color:#64748b;
            word-break:break-all;
        ">
            #${escapeHTML(order.id)}
        </p>

        <div style="
            padding:14px;
            background:#eff6ff;
            border-radius:12px;
            margin-bottom:20px;
        ">
            <div style="
                font-size:13px;
                color:#64748b;
            ">
                Statut actuel
            </div>

            <strong style="
                display:block;
                margin-top:4px;
                color:#1d4ed8;
                font-size:17px;
            ">
                ${escapeHTML(statusLabel(order.status))}
            </strong>
        </div>

        <div style="
            margin-bottom:20px;
        ">
            <strong>Produits commandés</strong>

            <div style="margin-top:8px;">
                ${itemRows || `
                    <div style="color:#64748b;padding:12px 0;">
                        Aucun produit trouvé.
                    </div>
                `}
            </div>
        </div>

        <div style="
            padding:16px 0;
            border-top:2px solid #e2e8f0;
        ">

            <div style="
                display:flex;
                justify-content:space-between;
                gap:15px;
                margin-bottom:8px;
            ">
                <span>Sous-total</span>
                <strong>${formatMoney(order.subtotal, order.currency)}</strong>
            </div>

            <div style="
                display:flex;
                justify-content:space-between;
                gap:15px;
                margin-bottom:8px;
            ">
                <span>Livraison</span>
                <strong>${formatMoney(order.shipping_fee, order.currency)}</strong>
            </div>

            <div style="
                display:flex;
                justify-content:space-between;
                gap:15px;
                padding-top:10px;
                border-top:1px solid #e2e8f0;
                font-size:18px;
            ">
                <strong>Total</strong>
                <strong>${formatMoney(order.total, order.currency)}</strong>
            </div>

        </div>

        <div style="
            margin-top:24px;
            padding-top:18px;
            border-top:2px solid #e2e8f0;
        ">

            <h3 style="
                margin:0 0 12px;
                font-size:17px;
                color:#0f172a;
            ">
                🕒 Historique des statuts
            </h3>

            <div id="customerOrderHistory">
                <div style="
                    padding:12px;
                    color:#64748b;
                    font-size:14px;
                ">
                    Chargement de l'historique...
                </div>
            </div>

        </div>

        <button
            id="closeOrderDetails"
            type="button"
            class="btn btn-secondary"
            style="width:100%;margin-top:20px;"
        >
            Fermer
        </button>
    `;

    overlay.appendChild(box);
    document.body.appendChild(overlay);

    document.getElementById("closeOrderDetails").onclick = () => {
        overlay.remove();
    };

    overlay.onclick = event => {
        if (event.target === overlay) {
            overlay.remove();
        }
    };

    const historyBox = document.getElementById("customerOrderHistory");

    const {
        data: history,
        error: historyError
    } = await supabaseClient
        .from("order_status_history")
        .select("id, old_status, new_status, changed_at")
        .eq("order_id", order.id)
        .order("changed_at", { ascending: false });

    if (historyError) {

        console.error(
            "Erreur chargement historique client :",
            historyError
        );

        historyBox.innerHTML = `
            <div style="
                padding:12px;
                border-radius:10px;
                background:#fef2f2;
                color:#dc2626;
                font-size:14px;
            ">
                Impossible de charger l'historique.
            </div>
        `;

        return;
    }

    if (!history || history.length === 0) {

        historyBox.innerHTML = `
            <div style="
                padding:12px;
                border-radius:10px;
                background:#f8fafc;
                color:#64748b;
                font-size:14px;
            ">
                Aucun historique disponible pour cette commande.
            </div>
        `;

        return;
    }

    historyBox.innerHTML = history.map(entry => {

        const transition = entry.old_status
            ? `${statusLabel(entry.old_status)} → ${statusLabel(entry.new_status)}`
            : `Commande créée → ${statusLabel(entry.new_status)}`;

        return `
            <div style="
                padding:12px 0;
                border-bottom:1px solid #e2e8f0;
            ">

                <div style="
                    font-weight:700;
                    color:#0f172a;
                ">
                    ${escapeHTML(statusLabel(entry.new_status))}
                </div>

                <div style="
                    margin-top:4px;
                    color:#475569;
                    font-size:14px;
                ">
                    ${escapeHTML(transition)}
                </div>

                <div style="
                    margin-top:4px;
                    color:#94a3b8;
                    font-size:12px;
                ">
                    ${escapeHTML(formatDate(entry.changed_at))}
                </div>

            </div>
        `;
    }).join("");
}


loadOrders();
</script>

</body>
</html>
