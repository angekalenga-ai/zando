<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zando — Espace vendeur</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8fafc;
    color: #0f172a;
}

header {
    background: #111827;
    color: white;
    padding: 18px 20px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.brand {
    font-size: 24px;
    font-weight: 900;
}

.subtitle {
    color: #cbd5e1;
    margin-top: 4px;
    font-size: 13px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px 20px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.06);
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,.06);
}

.stat-label {
    display: block;
    color: #64748b;
    font-size: 14px;
    margin-bottom: 8px;
}

.stat strong {
    font-size: 28px;
}

.badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
}

.pending {
    background: #fef3c7;
    color: #92400e;
}

.active {
    background: #dcfce7;
    color: #166534;
}

.inactive {
    background: #fee2e2;
    color: #991b1b;
}

.btn {
    border: 0;
    border-radius: 10px;
    padding: 12px 16px;
    font-weight: 800;
    cursor: pointer;
}

.primary {
    background: #2563eb;
    color: white;
}

.secondary {
    background: #e2e8f0;
    color: #0f172a;
}

.danger {
    background: #fee2e2;
    color: #991b1b;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 13px 10px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
}

th {
    color: #64748b;
    font-size: 13px;
}

.empty {
    text-align: center;
    color: #64748b;
    padding: 30px;
}

#error {
    display: none;
    background: #fee2e2;
    color: #991b1b;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
}

#loading {
    text-align: center;
    padding: 60px 20px;
    color: #64748b;
}

#productFormBox {
    margin-bottom: 20px;
}

#productForm {
    display: grid;
    gap: 14px;
}

#productForm h2 {
    margin: 0 0 8px;
    font-size: 22px;
}

#productForm input[type="file"] {
    padding: 10px;
    background: #f8fafc;
}

#productForm label {
    font-weight: 700;
    font-size: 14px;
    color: #334155;
}

#productForm input,
#productForm textarea,
#productForm select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font: inherit;
    background: #fff;
}

#productForm textarea {
    min-height: 110px;
    resize: vertical;
}

#productForm .form-section {
    padding: 18px;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    background: #f8fafc;
}

#productForm .form-section-title {
    margin: 0 0 14px;
    font-size: 16px;
    font-weight: 800;
    color: #0f172a;
}

#productForm input:focus,
#productForm textarea:focus,
#productForm select:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}

#productForm button {
    margin-top: 4px;
}

@media (min-width: 701px) {
    #productForm {
        grid-template-columns: 1fr 1fr;
    }

    #productForm > input[type="hidden"],
    #productForm > h2,
    #productForm > .form-section:first-of-type {
        grid-column: 1 / -1;
    }

    #productForm > .form-section {
        align-self: start;
    }

    #productForm > .form-section:last-of-type {
        grid-column: 1 / -1;
    }
}

@media (max-width: 700px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .header-inner {
        align-items: flex-start;
        flex-direction: column;
    }

    .table-wrap {
        overflow-x: auto;
    }

    table {
        min-width: 650px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div>
            <div class="brand">Zando 🛍️</div>

            <div class="subtitle">
                Espace vendeur
            </div>
        </div>

        <button
            class="btn secondary"
            id="logoutBtn"
        >
            Déconnexion
        </button>

    </div>
</header>

<main class="container">

    <div id="loading">
        Chargement de votre espace vendeur...
    </div>

    <div id="error"></div>

    <div id="productFormBox" style="display:none;">
<h2 id="productFormTitle">Ajouter un produit</h2>
<form id="productForm">
<input type="hidden" id="productId">
<div class="form-section">
<h3 class="form-section-title">Informations du produit</h3>
<label>Nom du produit</label>
<input id="productName" required>
<label>Description</label>
<textarea id="productDescription"></textarea>
</div>
<div class="form-section">
<h3 class="form-section-title">Prix et stock</h3>
<label>Prix</label>
<input id="productPrice" type="number" min="0" step="0.01" required>
<label>Prix comparé</label>
<input id="productComparePrice" type="number" min="0" step="0.01">
<label>Devise</label>
<select id="productCurrency"><option value="CDF">CDF</option><option value="USD">USD</option><option value="EUR">EUR</option></select>
<label>Stock</label>
<input id="productStock" type="number" min="0" step="1" value="0" required>
</div>
<div class="form-section">
<h3 class="form-section-title">Catégorisation</h3>
<label>Catégorie</label>
<select id="productCategory"><option value="">Aucune catégorie</option></select>
<label>Sous-catégorie</label>
<select id="productSubcategory" disabled><option value="">Aucune sous-catégorie</option></select>
</div>
<div class="form-section">
<h3 class="form-section-title">Publication et image</h3>
<label>Statut</label>
<select id="productStatus"><option value="active">Actif</option><option value="draft">Brouillon</option><option value="inactive">Inactif</option></select>
<label>Image du produit</label>
<input id="productImage" type="file" accept="image/jpeg,image/png,image/webp">
<button type="submit" class="btn primary">Enregistrer</button>
<button type="button" class="btn secondary" id="cancelProductBtn">Annuler</button>
</form>
</div>

<section id="sellerContent" style="display:none;">

        <div class="card">

            <h1 id="storeName">
                Ma boutique
            </h1>

            <p id="storeDescription">
                —
            </p>

            <span
                id="storeStatus"
                class="badge"
            >
                —
            </span>

        </div>

        <section class="stats">

            <div class="stat">
                <span class="stat-label">
                    📦 Produits
                </span>

                <strong id="statProducts">
                    0
                </strong>
            </div>

            <div class="stat">
                <span class="stat-label">
                    📊 Produits actifs
                </span>

                <strong id="statActiveProducts">
                    0
                </strong>
            </div>

            <div class="stat">
                <span class="stat-label">
                    🏪 Boutique
                </span>

                <strong id="statStoreStatus">
                    —
                </strong>
            </div>

        </section>

        <section class="card">

            <div class="actions">

                <button
                    class="btn primary"
                    id="addProductBtn"
                >
                    ➕ Ajouter un produit
                </button>

                <button
                    class="btn secondary"
                    id="refreshBtn"
                >
                    🔄 Actualiser
                </button>

            </div>

        </section>

        <section class="card">

            <h2>Mes produits</h2>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>Produit</th>
                            <th>Prix</th>
                            <th>Stock</th>
                            <th>Statut</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="productsBody">

                        <tr>
                            <td
                                colspan="5"
                                class="empty"
                            >
                                Chargement...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </section>

</main>

<script>

const SUPABASE_URL =
    "https://kcrliiinrjlrcspnaeac.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_iv3rzG16WGv7e7DObdzCNw_dDs4VDM3";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );

let currentUser = null;
let currentStore = null;
let products = [];
let categories = [];
let editingProductId = null;

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

function showError(message) {

    const box =
        document.getElementById("error");

    box.textContent =
        message || "Une erreur est survenue.";

    box.style.display = "block";

}

function hideLoading() {

    document
        .getElementById("loading")
        .style.display = "none";

}

function statusLabel(status) {

    const labels = {

        pending: "En attente",
        active: "Active",
        inactive: "Inactive"

    };

    return labels[status] || status || "—";

}

async function requireSeller() {

    const {
        data: {
            user
        },
        error
    } =
        await supabaseClient.auth.getUser();

    if (error) {
        throw error;
    }

    if (!user) {

        throw new Error(
            "Vous devez être connecté."
        );

    }

    currentUser = user;

    const {
        data: profile,
        error: profileError
    } =
        await supabaseClient
            .from("profiles")
            .select("role")
            .eq("id", user.id)
            .single();

    if (profileError) {
        throw profileError;
    }

    if (
        profile.role !== "seller" &&
        profile.role !== "admin"
    ) {

        throw new Error(
            "SELLER_REQUIRED"
        );

    }

}

async function loadStore() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("stores")
            .select(`
                id,
                name,
                slug,
                description,
                status
            `)
            .eq(
                "owner_id",
                currentUser.id
            )
            .maybeSingle();

    if (error) {
        throw error;
    }

    if (!data) {

        throw new Error(
            "Aucune boutique n'est associée à ce compte."
        );

    }

    currentStore = data;

    document
        .getElementById("storeName")
        .textContent = data.name;

    document
        .getElementById("storeDescription")
        .textContent =
            data.description ||
            "Aucune description.";

    const status =
        document.getElementById("storeStatus");

    status.textContent =
        statusLabel(data.status);

    status.className =
        "badge " +
        (data.status || "");

    document
        .getElementById("statStoreStatus")
        .textContent =
            statusLabel(data.status);

}

async function loadCategories() {

    const { data, error } = await supabaseClient
        .from("categories")
        .select("id, name, parent_id")
        .order("name", { ascending: true });

    if (error) {
        console.error(error);
        return;
    }

    categories = data || [];

    const mainCategories =
        categories.filter(category => !category.parent_id);

    const categorySelect =
        document.getElementById("productCategory");

    const subcategorySelect =
        document.getElementById("productSubcategory");

    if (categorySelect) {
        categorySelect.innerHTML =
            '<option value="">Aucune catégorie</option>' +
            mainCategories.map(category =>
                `<option value="${category.id}">${escapeHTML(category.name)}</option>`
            ).join("");
    }

    if (subcategorySelect) {
        subcategorySelect.innerHTML =
            '<option value="">Aucune sous-catégorie</option>';
        subcategorySelect.disabled = true;
    }
}

function loadSubcategories(parentId, selectedId = "") {

    const subcategorySelect =
        document.getElementById("productSubcategory");

    if (!subcategorySelect) return;

    const subcategories =
        categories.filter(
            category => category.parent_id === parentId
        );

    subcategorySelect.innerHTML =
        '<option value="">Aucune sous-catégorie</option>' +
        subcategories.map(category =>
            `<option value="${category.id}">${escapeHTML(category.name)}</option>`
        ).join("");

    subcategorySelect.disabled =
        subcategories.length === 0;

    if (selectedId) {
        subcategorySelect.value = selectedId;
    }
}

const productCategorySelect =
    document.getElementById("productCategory");

if (productCategorySelect) {
    productCategorySelect.addEventListener("change", function () {
        loadSubcategories(this.value);
    });
}

async function loadProducts() {

    document.getElementById("loading").textContent =
        "Connexion à la base des produits...";

    console.log("Début chargement produits", currentStore.id);

    const result = await supabaseClient
        .from("products")
        .select(`
            id,
            name,
            slug,
            description,
            price,
            compare_at_price,
            currency,
            stock_quantity,
            status,
            category_id
        `)
        .eq("store_id", currentStore.id)
        .order("created_at", {
            ascending: false
        });

    document.getElementById("loading").textContent =
        "Réponse de la base reçue...";

    console.log("Résultat produits :", result);

    const { data, error } = result;

    if (error) {
        throw error;
    }

    products = data || [];

    document.getElementById("statProducts").textContent =
        products.length;

    document.getElementById("statActiveProducts").textContent =
        products.filter(
            product => product.status === "active"
        ).length;

    document.getElementById("loading").textContent =
        "Affichage des produits...";

    renderProducts();

}

function renderProducts() {

    const body =
        document.getElementById(
            "productsBody"
        );

    if (!products.length) {

        body.innerHTML = `
            <tr>
                <td
                    colspan="5"
                    class="empty"
                >
                    Aucun produit pour le moment.
                </td>
            </tr>
        `;

        return;

    }

    body.innerHTML =
        products.map(product => {

            const price =
                Number(
                    product.price || 0
                ).toFixed(2);

            return `
                <tr>

                    <td>
                        <strong>
                            ${escapeHTML(product.name)}
                        </strong>
                    </td>

                    <td>
                        ${price}
                        ${escapeHTML(
                            product.currency || "USD"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            product.stock_quantity ?? 0
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            statusLabel(
                                product.status
                            )
                        )}
                    </td>

                    <td>
                        <button
                            class="btn secondary"
                            onclick="editProduct('${escapeHTML(product.id)}')"
                        >
                            ✏️ Modifier
                        </button>
                        <button
                            class="btn danger"
                            onclick="deleteProduct('${escapeHTML(product.id)}')"
                        >
                            🗑️ Supprimer
                        </button>
                    </td>

                </tr>
            `;

        }).join("");

}

async function uploadProductImage(file, productId) {
    if (!file) return null;

    const ext = file.name.split(".").pop().toLowerCase();
    const path = currentUser.id + "/" + productId + "." + ext;

    const { error } = await supabaseClient.storage
        .from("product-images")
        .upload(path, file, {
            contentType: file.type,
            upsert: false
        });

    if (error) throw error;

    const { data } = supabaseClient.storage
        .from("product-images")
        .getPublicUrl(path);

    return data.publicUrl;
}

async function saveProduct(event) {
    event.preventDefault();

    const name = document.getElementById("productName").value.trim();
    const price = Number(document.getElementById("productPrice").value);
    const stock = Number(document.getElementById("productStock").value);
    const currency = document.getElementById("productCurrency").value;
    const status = document.getElementById("productStatus").value;
    const imageFile = document.getElementById("productImage").files[0] || null;


    if (!name || !Number.isFinite(price)) {
        alert("Veuillez remplir les champs obligatoires.");
        return;
    }

    const existingProduct = editingProductId
        ? products.find(item => item.id === editingProductId)
        : null;

    const productSlug = existingProduct?.slug ||
        name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + Date.now();

    const payload = {
        name,
        slug: productSlug,
        description: document.getElementById("productDescription").value.trim() || null,
        price,
        compare_at_price: document.getElementById("productComparePrice").value === "" ? null : Number(document.getElementById("productComparePrice").value),
        currency,
        stock_quantity: stock,
        status,
        store_id: currentStore.id,
        category_id: document.getElementById("productSubcategory").value || document.getElementById("productCategory").value || null
    };
    let savedProductId = editingProductId;
    if (editingProductId) {
        const { error } = await supabaseClient
            .from("products")
            .update(payload)
            .eq("id", editingProductId)
            .eq("store_id", currentStore.id);

        if (error) {
            alert("Erreur : " + error.message);
            return;
        }
    } else {
        const { data: createdProduct, error } = await supabaseClient
            .from("products")
            .insert(payload)
            .select("id")
            .single();

        if (error) {
            alert("Erreur : " + error.message);
            return;
        }

        savedProductId = createdProduct.id;
    }

    if (imageFile) {
        try {
            const imageUrl =
                await uploadProductImage(
                    imageFile,
                    savedProductId
                );

            if (imageUrl) {
                const { error: imageError } =
                    await supabaseClient
                        .from("product_images")
                        .insert({
                            product_id:
                                savedProductId,
                            image_url:
                                imageUrl,
                            alt_text:
                                name,
                            sort_order:
                                0
                        });

                if (imageError) {
                    throw imageError;
                }
            }

        } catch (imageError) {
            console.error(
                "Erreur image :",
                imageError
            );

            alert(
                "Produit créé, mais impossible d'enregistrer l'image : " +
                imageError.message
            );
        }
    }

    await loadProducts();
    document.getElementById("productForm").reset();
    document.getElementById("productFormBox").style.display = "none";
}
document.getElementById("cancelProductBtn").addEventListener("click", () => { editingProductId = null; document.getElementById("productFormTitle").textContent = "Ajouter un produit"; document.getElementById("productForm").reset(); document.getElementById("productFormBox").style.display = "none"; });
document.getElementById("productForm").addEventListener("submit", saveProduct);
async function deleteProduct(productId) {
    const product = products.find(item => item.id === productId);
    if (!product) return;

    if (!confirm("Supprimer ce produit ?")) return;

    const { error } = await supabaseClient
        .from("products")
        .delete()
        .eq("id", productId)
        .eq("store_id", currentStore.id);

    if (error) {
        console.error(error);
        alert("Impossible de supprimer le produit.");
        return;
    }

    await loadProducts();
    alert("Produit supprimé avec succès.");
}

function editProduct(productId) {

    const product =
        products.find(
            item =>
                item.id === productId
        );

    if (!product) {
        return;
    }

    editingProductId = product.id;

    document.getElementById("productFormTitle").textContent =
        "Modifier le produit";

    document.getElementById("productId").value =
        product.id;

    document.getElementById("productName").value =
        product.name || "";

    document.getElementById("productDescription").value =
        product.description || "";

    document.getElementById("productPrice").value =
        product.price ?? "";

    document.getElementById("productComparePrice").value =
        product.compare_at_price ?? "";

    document.getElementById("productCurrency").value =
        product.currency || "CDF";

    document.getElementById("productStock").value =
        product.stock_quantity ?? 0;

    document.getElementById("productStatus").value =
        product.status || "draft";

    const category =
        categories.find(
            item =>
                item.id === product.category_id
        );

    if (category && category.parent_id) {

        document.getElementById("productCategory").value =
            category.parent_id;

        loadSubcategories(
            category.parent_id,
            category.id
        );

    } else {

        document.getElementById("productCategory").value =
            product.category_id || "";

        loadSubcategories(
            product.category_id || ""
        );

    }

    document.getElementById("productFormBox").style.display =
        "block";

    document.getElementById("productFormBox").scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

document
    .getElementById("refreshBtn")
    .addEventListener(
        "click",
        init
    );

document
    .getElementById("addProductBtn")
    .addEventListener(
        "click",
        () => {
            document.getElementById("productFormBox").style.display = "block";
        }
    );
document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        async () => {

            await supabaseClient
                .auth
                .signOut();

            window.location.href =
                "index.html";

        }
    );

async function init() {

    try {

        document.getElementById("error").style.display = "none";

        document.getElementById("loading").textContent =
            "Vérification du compte...";

        const sessionCheck = await supabaseClient.auth.getSession();

        if (sessionCheck.error) {
            throw sessionCheck.error;
        }

        if (!sessionCheck.data.session) {
            throw new Error("SESSION_ABSENTE_DANS_SELLER");
        }

        await requireSeller();

        document.getElementById("loading").textContent =
            "Chargement de la boutique...";

        await loadStore();

        document.getElementById("loading").textContent =
            "Chargement des catégories...";

        await loadCategories();

        document.getElementById("loading").textContent =
            "Chargement des produits...";

        await loadProducts();

        document.getElementById("loading").textContent =
            "Affichage de votre espace vendeur...";

        document
            .getElementById("sellerContent")
            .style.display = "block";

        hideLoading();

    } catch (error) {

        console.error(
            "❌ Espace vendeur :",
            error
        );

        hideLoading();

        const message =
            error?.message ||
            String(error) ||
            "Impossible de charger l'espace vendeur.";

        showError(
            "Erreur de chargement : " + message
        );

    }

}

window.editProduct =
    editProduct;

init();

</script>
