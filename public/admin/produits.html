<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zando Panafricain — Produits</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .topbar {
            background: #111827;
            color: white;
            padding: 16px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .topbar h1 {
            margin: 0;
            font-size: 20px;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 1250px;
            margin: 25px auto;
            padding: 0 16px;
        }

        .toolbar {
            background: white;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 4px 18px rgba(0,0,0,.06);
            margin-bottom: 20px;
        }

        .toolbar-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        input,
        select {
            border: 1px solid #d7dce5;
            border-radius: 9px;
            padding: 11px 13px;
            font-size: 14px;
            background: white;
        }

        input {
            flex: 1;
            min-width: 220px;
        }

        select {
            min-width: 150px;
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 11px 16px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: #111827;
            color: white;
        }

        .btn-secondary {
            background: #e8edf5;
            color: #172033;
        }

        .btn-danger {
            background: #fee2e2;
            color: #b91c1c;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: white;
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,.05);
        }

        .stat-label {
            color: #687386;
            font-size: 13px;
        }

        .stat-value {
            margin-top: 8px;
            font-size: 25px;
            font-weight: 700;
        }

        .card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,.06);
            overflow: hidden;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #edf0f5;
            font-size: 14px;
        }

        th {
            background: #f8fafc;
            color: #596579;
            font-size: 12px;
            text-transform: uppercase;
        }

        .product-name {
            font-weight: 700;
        }

        .muted {
            color: #778196;
            font-size: 12px;
            margin-top: 3px;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge-active {
            background: #dcfce7;
            color: #166534;
        }

        .badge-draft {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-inactive {
            background: #e5e7eb;
            color: #374151;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .message {
            padding: 15px 18px;
            font-size: 14px;
            display: none;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #778196;
        }

        .loading {
            text-align: center;
            padding: 35px;
            color: #687386;
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .topbar {
                padding: 14px;
            }

            .container {
                padding: 0 10px;
            }
        }
    </style>

<style>
.product-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 20px;
}

.product-modal.active {
    display: flex;
}

.product-modal-card {
    width: min(620px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: #fff;
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.product-modal-card h2 {
    margin-top: 0;
}

.product-form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.product-form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.product-form-group.full {
    grid-column: 1 / -1;
}

.product-form-group input,
.product-form-group textarea,
.product-form-group select {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 12px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font: inherit;
}

.product-form-group textarea {
    min-height: 100px;
    resize: vertical;
}

.product-modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

@media (max-width: 600px) {
    .product-form-grid {
        grid-template-columns: 1fr;
    }

    .product-form-group.full {
        grid-column: auto;
    }
}
</style>

</head>

<body>

<header class="topbar">
    <h1>🛍️ Gestion des produits</h1>

    <a
        class="back"
        href="./index.html"
    >
        ← Retour au dashboard
    </a>
</header>

<main class="container">

    <div
        id="message"
        class="message"
    ></div>

    <section class="stats">

        <div class="stat">
            <div class="stat-label">
                Total produits
            </div>

            <div
                id="totalProducts"
                class="stat-value"
            >
                0
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Produits actifs
            </div>

            <div
                id="activeProducts"
                class="stat-value"
            >
                0
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Brouillons
            </div>

            <div
                id="draftProducts"
                class="stat-value"
            >
                0
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Stock total
            </div>

            <div
                id="totalStock"
                class="stat-value"
            >
                0
            </div>
        </div>

    </section>

    <section class="toolbar">

        <div class="toolbar-row">

            <input
                id="searchInput"
                type="search"
                placeholder="🔎 Rechercher un produit..."
            >

            <select id="statusFilter">

                <option value="">
                    Tous les statuts
                </option>

                <option value="active">
                    Actifs
                </option>

                <option value="draft">
                    Brouillons
                </option>

                <option value="inactive">
                    Inactifs
                </option>

            </select>

            <button
                id="refreshBtn"
                class="btn-secondary"
            >
                🔄 Actualiser
            </button>

            <button
                id="addBtn"
                class="btn-primary"
            >
                ➕ Ajouter
            </button>

        </div>

    </section>

    <section class="card">

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Produit</th>
                        <th>Boutique</th>
                        <th>Prix</th>
                        <th>Stock</th>
                        <th>Statut</th>
                        <th>Créé le</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="productsBody">

                    <tr>
                        <td
                            colspan="7"
                            class="loading"
                        >
                            Chargement des produits...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

<div id="productModal" class="product-modal">
    <div class="product-modal-card">
        <h2 id="productModalTitle">Ajouter un produit</h2>

        <form id="productForm">
            <div class="product-form-grid">

                <div class="product-form-group full">
                    <label for="productName">Nom du produit *</label>
                    <input id="productName" type="text" required>
                </div>

                <div class="product-form-group full">
                    <label for="productDescription">Description</label>
                    <textarea id="productDescription"></textarea>
                </div>

                <div class="product-form-group">
                    <label for="productPrice">Prix *</label>
                    <input id="productPrice" type="number" min="0" step="0.01" required>
                </div>

                <div class="product-form-group">
                    <label for="productComparePrice">Prix barré</label>
                    <input id="productComparePrice" type="number" min="0" step="0.01">
                </div>

                <div class="product-form-group">
                    <label for="productCurrency">Devise *</label>
                    <select id="productCurrency">
                        <option value="USD">USD</option>
                        <option value="CDF">CDF</option>
                        <option value="EUR">EUR</option>
                    </select>
                </div>

                <div class="product-form-group">
                    <label for="productStock">Stock *</label>
                    <input id="productStock" type="number" min="0" step="1" required>
                </div>

                <div class="product-form-group">
                    <label for="productStatus">Statut *</label>
                    <select id="productStatus">
                        <option value="draft">Brouillon</option>
                        <option value="active">Actif</option>
                    </select>
                </div>

                <div class="product-form-group">
                    <label for="productStore">Boutique *</label>
                    <select id="productStore" required></select>
                </div>

                <div class="product-form-group">
                    <label for="productCategory">Catégorie</label>
                    <select id="productCategory">
                        <option value="">Aucune catégorie</option>
                    </select>
                </div>

            </div>

            <div class="product-modal-actions">
                <button type="button" class="btn secondary" id="cancelProductBtn">
                    Annuler
                </button>

                <button type="submit" class="btn primary">
                    Enregistrer
                </button>
            </div>
        </form>
    </div>
</div>

<script>

const SUPABASE_URL =
    "https://kcrliiinrjlrcspnaeac.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_iv3rzG16WGv7e7DObdzCNw_dDs4VDM3";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

let products = [];

function showMessage(
    text,
    type = "success"
) {
    const message =
        document.getElementById("message");

    message.textContent = text;
    message.className =
        "message " + type;
}

function clearMessage() {
    const message =
        document.getElementById("message");

    message.textContent = "";
    message.className = "message";
}

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

function statusLabel(status) {

    const labels = {
        active: "Actif",
        draft: "Brouillon",
        inactive: "Inactif"
    };

    return labels[status] || status || "—";
}

function statusClass(status) {

    if (status === "active") {
        return "badge badge-active";
    }

    if (status === "draft") {
        return "badge badge-draft";
    }

    return "badge badge-inactive";
}

async function requireAdmin() {

    const {
        data: {
            user
        },
        error
    } =
        await supabaseClient.auth.getUser();

    if (error) {
        throw error;
    }

    if (!user) {
        throw new Error(
            "AUTH_REQUIRED"
        );
    }

    const {
        data: profile,
        error: profileError
    } =
        await supabaseClient
            .from("profiles")
            .select("role")
            .eq("id", user.id)
            .single();

    if (profileError) {
        throw profileError;
    }

    if (
        !profile ||
        profile.role !== "admin"
    ) {
        throw new Error(
            "ADMIN_REQUIRED"
        );
    }

    return user;
}


function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

let stores = [];
let categories = [];
let editingProductId = null;

async function loadStoresAndCategories() {

    const storesResult = await supabaseClient
        .from("stores")
        .select("id, name, status")
        .order("name", { ascending: true });

    if (storesResult.error) {
        throw storesResult.error;
    }

    stores = storesResult.data || [];

    const categoriesResult = await supabaseClient
        .from("categories")
        .select("id, name")
        .order("name", { ascending: true });

    if (categoriesResult.error) {
        throw categoriesResult.error;
    }

    categories = categoriesResult.data || [];

    const storeSelect =
        document.getElementById("productStore");

    const categorySelect =
        document.getElementById("productCategory");

    if (storeSelect) {
        storeSelect.innerHTML =
            '<option value="">Sélectionner une boutique</option>' +
            stores.map(store =>
                `<option value="${store.id}">
                    ${escapeHtml(store.name)}
                </option>`
            ).join("");
    }

    if (categorySelect) {
        categorySelect.innerHTML =
            '<option value="">Aucune catégorie</option>' +
            categories.map(category =>
                `<option value="${category.id}">
                    ${escapeHtml(category.name)}
                </option>`
            ).join("");
    }
}

function openProductModal(product = null) {

    const modal =
        document.getElementById("productModal");

    const title =
        document.getElementById("productModalTitle");

    if (!modal) return;

    editingProductId = product?.id || null;

    if (title) {
        title.textContent =
            product
                ? "Modifier le produit"
                : "Ajouter un produit";
    }

    document.getElementById("productName").value =
        product?.name || "";

    document.getElementById("productDescription").value =
        product?.description || "";

    document.getElementById("productPrice").value =
        product?.price ?? "";

    document.getElementById("productComparePrice").value =
        product?.compare_at_price ?? "";

    document.getElementById("productCurrency").value =
        product?.currency || "USD";

    document.getElementById("productStock").value =
        product?.stock_quantity ?? 0;

    document.getElementById("productStatus").value =
        product?.status || "draft";

    document.getElementById("productStore").value =
        product?.store_id || "";

    document.getElementById("productCategory").value =
        product?.category_id || "";

    modal.classList.add("active");
}

function closeProductModal() {

    const modal =
        document.getElementById("productModal");

    if (modal) {
        modal.classList.remove("active");
    }

    editingProductId = null;

    const form =
        document.getElementById("productForm");

    if (form) {
        form.reset();
    }
}

async function saveProduct(event) {

    event.preventDefault();

    const name =
        document.getElementById("productName").value.trim();

    const description =
        document.getElementById("productDescription").value.trim();

    const priceValue =
        document.getElementById("productPrice").value;

    const comparePriceValue =
        document.getElementById("productComparePrice").value;

    const currency =
        document.getElementById("productCurrency").value;

    const stock =
        Number(document.getElementById("productStock").value);

    const status =
        document.getElementById("productStatus").value;

    const storeId =
        document.getElementById("productStore").value;

    const categoryId =
        document.getElementById("productCategory").value || null;

    if (!name || priceValue === "" || !storeId) {
        alert("Veuillez remplir les champs obligatoires.");
        return;
    }

    const price = Number(priceValue);

    const compareAtPrice =
        comparePriceValue === ""
            ? null
            : Number(comparePriceValue);

    const slug =
        name
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-|-$/g, "");

    const payload = {
        name,
        slug,
        description: description || null,
        price,
        compare_at_price: compareAtPrice,
        currency,
        stock_quantity: stock,
        status,
        store_id: storeId,
        category_id: categoryId
    };

    try {

        let result;

        if (editingProductId) {

            result = await supabaseClient
                .from("products")
                .update(payload)
                .eq("id", editingProductId);

        } else {

            result = await supabaseClient
                .from("products")
                .insert(payload);

        }

        if (result.error) {
            throw result.error;
        }

        closeProductModal();

        await loadProducts();

        alert(
            editingProductId
                ? "Produit modifié avec succès."
                : "Produit ajouté avec succès."
        );

    } catch (error) {

        console.error(
            "❌ Erreur enregistrement produit :",
            error
        );

        alert(
            "Impossible d'enregistrer le produit : " +
            (error.message || "Erreur inconnue")
        );
    }
}

async function loadProducts() {

    clearMessage();

    const body =
        document.getElementById(
            "productsBody"
        );

    body.innerHTML = `
        <tr>
            <td colspan="7" class="loading">
                Chargement des produits...
            </td>
        </tr>
    `;

    const {
        data,
        error
    } =
        await supabaseClient
            .from("products")
            .select(`
                id,
                name,
                price,
                compare_at_price,
                currency,
                stock_quantity,
                status,
                created_at,
                stores (
                    name
                )
            `)
            .order(
                "created_at",
                {
                    ascending: false
                }
            );

    if (error) {
        throw error;
    }

    products = data || [];

    updateStats();

    renderProducts();

}

function updateStats() {

    document.getElementById(
        "totalProducts"
    ).textContent =
        products.length;

    document.getElementById(
        "activeProducts"
    ).textContent =
        products.filter(
            p => p.status === "active"
        ).length;

    document.getElementById(
        "draftProducts"
    ).textContent =
        products.filter(
            p => p.status === "draft"
        ).length;

    document.getElementById(
        "totalStock"
    ).textContent =
        products.reduce(
            (total, product) =>
                total +
                Number(
                    product.stock_quantity || 0
                ),
            0
        );

}

function renderProducts() {

    const body =
        document.getElementById(
            "productsBody"
        );

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();

    const status =
        document.getElementById(
            "statusFilter"
        ).value;

    const filtered =
        products.filter(product => {

            const matchesSearch =
                !search ||
                String(
                    product.name || ""
                )
                .toLowerCase()
                .includes(search);

            const matchesStatus =
                !status ||
                product.status === status;

            return (
                matchesSearch &&
                matchesStatus
            );

        });

    if (!filtered.length) {

        body.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="empty"
                >
                    Aucun produit trouvé.
                </td>
            </tr>
        `;

        return;
    }

    body.innerHTML =
        filtered.map(product => {

            const price =
                Number(
                    product.price || 0
                ).toFixed(2);

            const created =
                product.created_at
                    ? new Date(
                        product.created_at
                    ).toLocaleDateString(
                        "fr-FR"
                    )
                    : "—";

            const store =
                product.stores?.name ||
                "—";

            return `
                <tr>

                    <td>
                        <div class="product-name">
                            ${escapeHTML(
                                product.name
                            )}
                        </div>
                    </td>

                    <td>
                        ${escapeHTML(store)}
                    </td>

                    <td>
                        <strong>
                            ${price}
                            ${escapeHTML(
                                product.currency ||
                                "USD"
                            )}
                        </strong>
                    </td>

                    <td>
                        ${escapeHTML(
                            product.stock_quantity ?? 0
                        )}
                    </td>

                    <td>
                        <span class="${statusClass(
                            product.status
                        )}">
                            ${escapeHTML(
                                statusLabel(
                                    product.status
                                )
                            )}
                        </span>
                    </td>

                    <td>
                        ${created}
                    </td>

                    <td>

                        <div class="actions">

                            <button
                                class="btn-secondary"
                                onclick="editProduct('${product.id}')"
                            >
                                ✏️
                            </button>

                            <button
                                class="btn-danger"
                                onclick="deleteProduct('${product.id}')"
                            >
                                🗑️
                            </button>

                        </div>

                    </td>

                </tr>
            `;

        }).join("");

}

function editProduct(id) {

    const product =
        products.find(
            p => p.id === id
        );

    if (!product) {
        return;
    }

    openProductModal(product);

}

async function deleteProduct(id) {

    const product =
        products.find(
            p => p.id === id
        );

    if (!product) {
        return;
    }

    const confirmed =
        confirm(
            `Supprimer définitivement "${product.name}" ?`
        );

    if (!confirmed) {
        return;
    }

    try {

        const { error } =
            await supabaseClient
                .from("products")
                .delete()
                .eq("id", id);

        if (error) {
            throw error;
        }

        await loadProducts();

        alert("Produit supprimé avec succès.");

    } catch (error) {

        console.error(
            "❌ Erreur suppression produit :",
            error
        );

        alert(
            "Impossible de supprimer le produit : " +
            (error.message || "Erreur inconnue")
        );
    }

}

async function init() {

    try {

        await requireAdmin();

        await loadStoresAndCategories();

        await loadProducts();

    } catch (error) {

        console.error(
            "Erreur admin produits :",
            error
        );

        if (
            error.message ===
            "AUTH_REQUIRED"
        ) {

            window.location.href =
                "./index.html";

            return;

        }

        if (
            error.message ===
            "ADMIN_REQUIRED"
        ) {

            await supabaseClient.auth.signOut();

            window.location.href =
                "./index.html";

            return;

        }

        showMessage(
            error.message ||
            "Impossible de charger les produits.",
            "error"
        );

    }

}

document
    .getElementById("refreshBtn")
    .addEventListener(
        "click",
        loadProducts
    );

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        renderProducts
    );

document
    .getElementById("statusFilter")
    .addEventListener(
        "change",
        renderProducts
    );

document
    .getElementById("addBtn")
    .addEventListener(
        "click",
        function () {
            openProductModal();
        }
    );

document
    .getElementById("productForm")
    .addEventListener(
        "submit",
        saveProduct
    );

document
    .getElementById("cancelProductBtn")
    .addEventListener(
        "click",
        closeProductModal
    );

document
    .getElementById("productModal")
    .addEventListener(
        "click",
        function (event) {
            if (event.target === this) {
                closeProductModal();
            }
        }
    );

init();

</script>




</body>
</html>
