<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Zando Admin — Tableau de bord</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        :root {
            --primary: #111827;
            --accent: #f59e0b;
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #172033;
            --muted: #667085;
            --border: #e5e9f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--bg);
            color: var(--text);
        }

        .login-screen {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0,0,0,.08);
        }

        .login-card h1 {
            margin-top: 0;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-top: 8px;
            margin-bottom: 18px;

            border: 1px solid var(--border);

            border-radius: 10px;

            font: inherit;
        }

        button {
            border: 0;

            padding: 12px 16px;

            border-radius: 10px;

            font: inherit;

            font-weight: 700;

            cursor: pointer;
        }

        .primary {
            width: 100%;

            background: var(--primary);

            color: white;
        }

        .message {
            margin-top: 15px;

            font-size: 14px;
        }

        /* =========================
           ADMIN LAYOUT
        ========================= */

        .admin-layout {
            min-height: 100vh;

            display: grid;

            grid-template-columns:
                250px 1fr;
        }

        .sidebar {
            background: var(--primary);

            color: white;

            padding: 24px 16px;
        }

        .brand {
            font-size: 26px;

            font-weight: 900;

            margin-bottom: 40px;
        }

        .brand span {
            color: var(--accent);
        }

        .menu {
            display: flex;

            flex-direction: column;

            gap: 8px;
        }

        .menu a {
            color: #cbd5e1;

            text-decoration: none;

            padding: 13px;

            border-radius: 10px;

            font-weight: 600;
        }

        .menu a:hover,
        .menu a.active {
            background: #1f2937;

            color: white;
        }

        .logout {
            margin-top: 40px;

            width: 100%;

            background: #374151;

            color: white;
        }

        .main {
            padding: 35px;
        }

        .page-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0;
        }

        .page-header p {
            color: var(--muted);
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;
        }

        .stat-card {
            background: var(--card);

            padding: 22px;

            border-radius: 16px;

            border:
                1px solid var(--border);
        }

        .stat-label {
            color: var(--muted);

            font-size: 14px;
        }

        .stat-value {
            display: block;

            margin-top: 8px;

            font-size: 30px;

            font-weight: 800;
        }

        /* =========================
           CONTENT
        ========================= */

        .content-card {
            margin-top: 25px;

            background: white;

            padding: 25px;

            border-radius: 16px;

            border:
                1px solid var(--border);
        }

        .quick-actions {
            display: flex;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 20px;
        }

        .action {
            display: inline-block;

            padding: 13px 18px;

            border-radius: 10px;

            background: #f3f4f6;

            color: var(--primary);

            text-decoration: none;

            font-weight: 700;
        }

        .action:hover {
            background: var(--accent);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .admin-layout {
                grid-template-columns:
                    1fr;
            }

            .sidebar {
                padding: 20px;
            }

            .menu {
                flex-direction: row;

                overflow-x: auto;
            }

            .menu a {
                white-space: nowrap;
            }

            .brand {
                margin-bottom: 20px;
            }

            .logout {
                margin-top: 20px;
            }

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 550px) {

            .main {
                padding: 20px;
            }

            .stats {
                grid-template-columns:
                    1fr;
            }

        }

    </style>
</head>

<body>


<!-- =========================
     LOGIN
========================= -->

<div
    id="loginScreen"
    class="login-screen"
>

    <div class="login-card">

        <h1>
            🔐 Administration Zando
        </h1>

        <p>
            Connectez-vous avec votre compte administrateur.
        </p>

        <form id="loginForm">

            <label>
                Adresse email
            </label>

            <input
                id="email"
                type="email"
                required
            >

            <label>
                Mot de passe
            </label>

            <input
                id="password"
                type="password"
                required
            >

            <button
                type="submit"
                class="primary"
            >
                Se connecter
            </button>

        </form>

        <div
            id="message"
            class="message"
        ></div>

    </div>

</div>


<!-- =========================
     ADMIN
========================= -->

<div
    id="adminApp"
    class="admin-layout"
    style="display:none"
>

    <aside class="sidebar">

        <div class="brand">
            Zando<span>Admin</span>
        </div>

        <nav class="menu">

            <a
                href="index.html"
                class="active"
            >
                📊 Tableau de bord
            </a>

            <a
                href="commandes.html"
            >
                📦 Commandes
            </a>

            <a href="#">
                🛍️ Produits
            </a>

            <a href="#">
                🏪 Vendeurs
            </a>

            <a href="#">
                👥 Utilisateurs
            </a>

        </nav>

        <button
            id="logoutBtn"
            class="logout"
        >
            Déconnexion
        </button>

    </aside>


    <main class="main">

        <div class="page-header">

            <div>

                <h1>
                    Tableau de bord
                </h1>

                <p>
                    Bienvenue dans l'administration Zando.
                </p>

            </div>

        </div>


        <section class="stats">

            <div class="stat-card">

                <span class="stat-label">
                    Clients
                </span>

                <strong
                    id="clientsCount"
                    class="stat-value"
                >
                    —
                </strong>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    Boutiques
                </span>

                <strong
                    id="storesCount"
                    class="stat-value"
                >
                    —
                </strong>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    Produits
                </span>

                <strong
                    id="productsCount"
                    class="stat-value"
                >
                    —
                </strong>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    Commandes
                </span>

                <strong
                    id="ordersCount"
                    class="stat-value"
                >
                    —
                </strong>

            </div>

        </section>


        <section class="content-card">

            <h2>
                Actions rapides
            </h2>

            <div class="quick-actions">

                <a
                    href="commandes.html"
                    class="action"
                >
                    📦 Gérer les commandes
                </a>

            </div>

        </section>

    </main>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://kcrliiinrjlrcspnaeac.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_iv3rzG16WGv7e7DObdzCNw_dDs4VDM3";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================
   AUTHENTIFICATION ADMIN
========================= */

async function requireAdmin() {

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();

    if (error) {
        throw error;
    }

    if (!user) {
        throw new Error("AUTH_REQUIRED");
    }

    const {
        data: profile,
        error: profileError
    } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

    if (profileError) {
        throw profileError;
    }

    if (!profile || profile.role !== "admin") {
        throw new Error("ADMIN_REQUIRED");
    }

    return user;
}


/* =========================
   STATISTIQUES DASHBOARD
========================= */

async function getCount(table, filter = null) {

    let query = supabaseClient
        .from(table)
        .select("*", {
            count: "exact",
            head: true
        });

    if (filter) {
        query = query.eq(filter.column, filter.value);
    }

    const { count, error } = await query;

    if (error) {
        console.error(`Erreur ${table}:`, error);
        return 0;
    }

    return count || 0;
}


async function loadDashboardStats() {

    const clientsCount =
        await getCount("profiles", {
            column: "role",
            value: "customer"
        });

    const storesCount =
        await getCount("stores");

    const productsCount =
        await getCount("products");

    const ordersCount =
        await getCount("orders");


    document.getElementById("clientsCount").textContent =
        clientsCount;

    document.getElementById("storesCount").textContent =
        storesCount;

    document.getElementById("productsCount").textContent =
        productsCount;

    document.getElementById("ordersCount").textContent =
        ordersCount;
}


/* =========================
   DÉCONNEXION
========================= */

async function logoutAdmin() {

    const { error } =
        await supabaseClient.auth.signOut();

    if (error) {
        console.error(error);
        return;
    }

    window.location.href =
        "../connexion.html";
}


/* =========================
   INITIALISATION
========================= */

async function initAdminDashboard() {

    try {

        await requireAdmin();

        await loadDashboardStats();

    } catch (error) {

        console.error(
            "Erreur dashboard admin:",
            error
        );

        if (error.message === "AUTH_REQUIRED") {

            window.location.href =
                "../connexion.html";

            return;
        }

        if (error.message === "ADMIN_REQUIRED") {

            alert(
                "Accès réservé aux administrateurs."
            );

            window.location.href =
                "../index.html";

            return;
        }

        alert(
            "Impossible de charger le dashboard administrateur."
        );
    }
}


document
    .getElementById("logoutBtn")
    .addEventListener("click", logoutAdmin);

initAdminDashboard();


</script>

</body>
</html>
